<title>Andrew Chen</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Public+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: your info beside a stippled oak on wide screens, above it on phones; one screen, no scrolling.
     Ink-on-paper neutrals biased slightly cool; muted slate-blue accent. */
  :root {
    --bg: #faf9f7;
    --fg: #22242a;
    --muted: #6b6e78;
    --line: #e2ddd4;
    --accent: #3a5a7d;
    --display: "Newsreader", Georgia, "Times New Roman", serif;
    --body: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16171b;
      --fg: #e7e6e3;
      --muted: #989ba5;
      --line: #2d2f36;
      --accent: #8fb4dd;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16171b;
    --fg: #e7e6e3;
    --muted: #989ba5;
    --line: #2d2f36;
    --accent: #8fb4dd;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    line-height: 1.6;
    font-size: 1.0625rem;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .wrap {
    position: relative;
    z-index: 1;
    height: 100%;
    padding-left: max(16px, env(safe-area-inset-left, 0px), var(--content-left, min(7vw, 6.5rem)));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 2rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 1.75rem;
  }
  /* The oak: a full-viewport canvas behind the content. */
  #oak { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

  /* Tuning panel: hidden unless #tune or the "t" key. */
  .tune {
    position: fixed;
    z-index: 2;
    right: calc(12px + env(safe-area-inset-right, 0px));
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.7rem 0.85rem;
    font-size: 0.8rem;
    display: grid;
    gap: 0.4rem;
    min-width: 15rem;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
  }
  .tune label { display: grid; grid-template-columns: 4.6rem 1fr 2.4rem; align-items: center; gap: 0.5rem; }
  .tune input[type="range"] { width: 100%; accent-color: var(--accent); }
  .tune output { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
  .tune .row { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-top: 0.2rem; }
  .tune button { font: inherit; cursor: pointer; background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 0.2rem 0.6rem; }
  .tune button:hover { border-color: var(--accent); color: var(--accent); }
  .tune button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tune .hint { color: var(--muted); }
  .tune[hidden] { display: none; }

  a { color: var(--accent); text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

  /* Photo and name */
  .avatar {
    width: 11rem;
    height: 11rem;
    max-width: 55vw;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    border: 1px solid var(--line);
  }
  h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(1.7rem, 5vw, 2.1rem);
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  /* Social icons */
  .socials { display: flex; flex-wrap: wrap; align-items: center; gap: 1.25rem; margin: 0; padding: 0; list-style: none; }
  .socials a {
    display: inline-flex;
    color: var(--muted);
    transition: color 0.15s ease;
  }
  .socials a:hover { color: var(--accent); }
  .socials a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 3px; }
  .socials svg { width: 1.35rem; height: 1.35rem; display: block; fill: currentColor; }

  /* The rules below must stay last so they win over the base rules. */

  /* Touch screens of any width: 44px tap areas around the link icons, without moving them visually. */
  @media (pointer: coarse) {
    .socials { gap: 0.25rem; margin: -0.7rem 0 0 -0.7rem; }
    .socials a { padding: 0.7rem; border-radius: 10px; }
  }

  /* Short, wide screens (a phone on its side): a smaller photo so your info clears the ground. */
  @media (min-width: 760px) and (max-height: 520px) {
    .wrap { gap: 1rem; }
    .avatar { width: 6.5rem; height: 6.5rem; }
    h1 { font-size: 1.5rem; }
  }

  /* Phones: your info centered in the upper part of the screen, the tree standing below it. */
  @media (max-width: 759px) {
    .wrap {
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-block: 9vh 2rem;
    }
    .avatar { width: 8rem; height: 8rem; }
    h1 { font-size: 1.75rem; }
    .socials { gap: 0.25rem; margin: -0.7rem 0 0; }
    .socials a { padding: 0.7rem; border-radius: 10px; }
  }
</style>

<div class="tune" id="tune" hidden>
  <label for="t-wind">Wind <input type="range" id="t-wind" min="0" max="1.5" step="0.05"><output id="t-wind-v"></output></label>
  <label for="t-gust">Gusts <input type="range" id="t-gust" min="0" max="1.5" step="0.05"><output id="t-gust-v"></output></label>
  <label for="t-flutter">Flutter <input type="range" id="t-flutter" min="0" max="1.5" step="0.05"><output id="t-flutter-v"></output></label>
  <div class="row"><span class="hint">Tree #<span id="t-seed"></span></span><button type="button" id="t-new">New tree</button></div>
</div>

<script>
(function () {
  var cv = document.getElementById("oak");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var P = { wind: 0.7, gust: 0.8, flutter: 0.6 };   // wind strength, gustiness, leaf flutter
  var seed = 7;                                       // the tree you picked

  // Seeded randomness: the same seed always grows the same tree.
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var NT = (function () { var r = mulberry32(4242), a = []; for (var i = 0; i < 512; i++) a.push(r()); return a; })();
  function noise1(x) { var i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f), a = NT[i & 511]; return a + (NT[(i + 1) & 511] - a) * u; }

  // Wind: a slow mean breeze plus gusts that roll across the scene left to right.
  // (The GPU path runs the same model in its shader; this copy drives the fallback and the loose leaves.)
  var WG = 0;
  function windAt(t, x) {
    var base = 0.45 + 0.55 * noise1(t * 0.00011 + 17.3);
    var g = noise1(t * 0.00042 - x * 1.1 + 3.7);
    g = Math.max(0, (g - 0.42) / 0.58); g = g * g * (3 - 2 * g);
    WG = g;
    return P.wind * (0.45 * base + P.gust * 1.1 * g);
  }

  var LEAF = [".", ",", ":", ";", "+", "*", "x", "%", "#", "@"];
  var BARK = [":", "!", "|", "|", "I", "#"];
  var GRASS = [",", ",", "'", "'", "\"", "`", "v", "w"];
  var FLY = ["~", "`", ",", "'", "-"];
  var CHARS = "@#%*+x;:,.'`\"-_~|!I()/\\vw", GI = {};
  for (var gi = 0; gi < CHARS.length; gi++) GI[CHARS[gi]] = gi;

  var AMP = 0.10, AMP2 = 0.028, ROT = 0.08;

  // --- Tree structure (world units: ground at y = 0, up is +y) ---
  var segs, clumps, tparts, leafIdx, TREE_H, B;
  function buildTree(sd) {
    var rnd = mulberry32(sd);
    segs = []; clumps = []; tparts = []; leafIdx = [];

    function grow(par, x, y, ang, len, w, d) {
      var x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len, idx = segs.length;
      segs.push({ x1: x, y1: y, x2: x2, y2: y2, w: w, d: d, om: 0.0010 + rnd() * 0.0010, ph: segs[par].ph + 0.35 + rnd() * 0.3, par: par });
      if (d >= 4) return;
      var n = 2 + (rnd() < 0.45 ? 1 : 0);
      for (var k = 0; k < n; k++) {
        var a2 = ang + (-0.55 + 1.1 * k / (n - 1)) + (rnd() - 0.5) * 0.35;
        a2 += (Math.PI / 2 - a2) * 0.3;               // lean toward a dome
        a2 = Math.max(-0.15, Math.min(Math.PI + 0.15, a2));
        grow(idx, x2, y2, a2, len * (0.66 + rnd() * 0.12), w * 0.64, d + 1);
      }
    }

    var th = 0.30 + rnd() * 0.06;
    segs.push({ x1: 0, y1: 0, x2: (rnd() - 0.5) * 0.03, y2: th, w: 0.095, d: 0, om: 0.0009, ph: rnd() * 6.2832, par: -1 });
    var mains = 4 + (rnd() < 0.5 ? 1 : 0);
    for (var i = 0; i < mains; i++) {
      var a = Math.PI / 2 + (-1.15 + 2.3 * i / (mains - 1)) * 0.62 + (rnd() - 0.5) * 0.2;
      grow(0, segs[0].x2, segs[0].y2, a, 0.34 + rnd() * 0.06, 0.052, 1);
    }

    // Crown: a lumpy dome around the limbs, filled with clumped foliage.
    var sx0 = 1e9, sx1 = -1e9, sy1 = -1e9;
    segs.forEach(function (s) { if (s.d >= 1) { sx0 = Math.min(sx0, s.x2); sx1 = Math.max(sx1, s.x2); sy1 = Math.max(sy1, s.y2); } });
    var ccx = (sx0 + sx1) / 2, rx = (sx1 - sx0) / 2 + 0.1, cbot = th + 0.05, ctop = sy1 + 0.1;
    if (ctop - cbot < rx / 0.7) ctop = cbot + rx / 0.7;   // a dome, not a flat umbrella
    var ccy = (cbot + ctop) / 2, ry = (ctop - cbot) / 2, hs = Math.imul(sd, 2654435761);
    function hash2(i, j) { var h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) ^ hs; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
    function noise2(x, y) {
      var i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
      var a = hash2(i, j), b = hash2(i + 1, j), c = hash2(i, j + 1), d = hash2(i + 1, j + 1);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    }
    function leafN(x, y) { return 0.62 * noise2(x * 7, y * 7) + 0.38 * noise2(x * 15 + 9.1, y * 15 + 3.3); }
    function ss(a, b, x) { var t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
    var leafPts = [], tries = 0, CROWN_N = 7000;
    while (leafPts.length < CROWN_N && tries < 400000) {
      tries++;
      var x = ccx + (rnd() * 2 - 1) * rx * 1.15, y = cbot - 0.04 + rnd() * (ctop - cbot + 0.08);
      var dy = y - ccy, ryy = dy < 0 ? ry * 0.82 : ry;
      var lump = 1 + 0.28 * (noise1(Math.atan2(dy / ryy, (x - ccx) / rx) * 2.2 + sd * 0.37) - 0.5);
      var rn = Math.sqrt(((x - ccx) / rx) * ((x - ccx) / rx) + (dy / ryy) * (dy / ryy)) / lump;
      if (rn >= 1) continue;
      var ln = leafN(x, y), cm = ss(0.36, 0.72, ln), e = ss(0, 0.28, 1 - rn);
      if (rnd() > cm * (0.3 + 0.7 * e)) continue;
      var under = Math.max(0, Math.min(1, (leafN(x, y + 0.03) - leafN(x, y - 0.03)) * 4 + 0.5));
      var low = 1 - (y - cbot) / (ctop - cbot);
      leafPts.push({ x: x, y: y, sv: Math.min(0.999, Math.max(0, 0.34 * cm + 0.26 * low + 0.26 * under + 0.14 * rnd())) });
    }
    // Leaves ride the nearest limb so the crown bends with its branches.
    segs.forEach(function (s, si) {
      if (s.d < 1) return;
      [0.5, 1].forEach(function (u) { clumps.push({ seg: si, u: u, cx: s.x1 + (s.x2 - s.x1) * u, cy: s.y1 + (s.y2 - s.y1) * u, rot: rnd() * 6.2832, om: 0.0012 + rnd() * 0.0012 }); });
    });
    var minX = 1e9, maxX = -1e9, maxY = -1e9;
    leafPts.forEach(function (lp) {
      var best = 0, bd = 1e9;
      for (var k = 0; k < clumps.length; k++) { var ex = clumps[k].cx - lp.x, ey = clumps[k].cy - lp.y, dd = ex * ex + ey * ey; if (dd < bd) { bd = dd; best = k; } }
      lp.c = best;
      minX = Math.min(minX, lp.x); maxX = Math.max(maxX, lp.x); maxY = Math.max(maxY, lp.y);
    });
    TREE_H = maxY; B = { minX: minX, maxX: maxX, maxY: maxY, cMinY: cbot };

    // Trunk and branches: bark shading on the trunk, angle-matched glyphs on limbs.
    segs.forEach(function (s, si) {
      var dx = s.x2 - s.x1, dy = s.y2 - s.y1, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len, px = -uy, py = ux;
      var og = Math.abs(uy) > 0.92 ? "|" : Math.abs(uy) < 0.38 ? "-" : (ux * uy > 0 ? "/" : "\\");
      var n = si === 0 ? 760 : Math.round(len * s.w * 5200 + len * 26);
      for (var j = 0; j < n; j++) {
        var u = rnd(), wu = s.w * (1 - 0.35 * u);
        if (si === 0) wu = s.w * (1 - 0.3 * u) * (1 + 0.9 * Math.exp(-u * len / 0.035));
        var o = (rnd() * 2 - 1) * wu / 2, p = { k: 1, s: si, u: u, ox: px * o, oy: py * o };
        if (si === 0) {
          var tt = p.ox / (wu / 2);
          if (tt < -0.82) p.fixed = "("; else if (tt > 0.82) p.fixed = ")";
          else { p.sv = Math.min(0.999, Math.max(0, 0.45 + 0.35 * tt + (noise1((p.ox + 0.2) * 90) - 0.5) * 0.5)); p.ramp = BARK; }
        } else if (s.w > 0.028 && Math.abs(o) < wu * 0.2) p.fixed = rnd() < 0.5 ? "%" : "#";
        else p.fixed = og;
        tparts.push(p);
      }
    });
    // Roots spreading into the hill.
    [[-1, 0.13], [1, 0.12], [-1, 0.07], [1, 0.08]].forEach(function (r) {
      for (var j = 0; j < 40; j++) {
        var u = rnd();
        tparts.push({ k: 1, s: 0, u: 0, ox: r[0] * (0.03 + u * r[1]), oy: 0.012 * (1 - u) - 0.004 + (rnd() - 0.5) * 0.008, fixed: r[0] < 0 ? "/" : "\\" });
      }
    });
    // Foliage, drawn over the limbs; heavier glyphs on shaded undersides.
    leafPts.forEach(function (lp) {
      var c = clumps[lp.c];
      leafIdx.push(tparts.length);
      tparts.push({ k: 2, c: lp.c, lx: lp.x - c.cx, ly: lp.y - c.cy, sh: rnd() * 6.2832, ramp: LEAF, sv: lp.sv });
    });
    tparts.forEach(function (p) { p.q = rnd(); }); // stable subset used to thin the tree on small screens
  }

  // Glyph weight follows shade; in dark mode the ramp flips so lit sides stay bright.
  var dark = false;
  function inkHex() { return getComputedStyle(document.documentElement).getPropertyValue("--fg").trim() || "#22242a"; }
  function detectDark() {
    var m = /^#([0-9a-f]{6})$/i.exec(inkHex());
    if (!m) { dark = false; return; }
    var n = parseInt(m[1], 16);
    dark = (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255 > 0.5;
  }
  function assign() {
    tparts.forEach(function (p) {
      if (p.fixed) { p.g = p.fixed; return; }
      var r = p.ramp, i = Math.min(r.length - 1, Math.floor((dark ? 1 - p.sv : p.sv) * r.length));
      p.g = r[i];
      p.ga = dark ? r[Math.min(r.length - 1, i + 3)] : r[Math.max(0, i - 3)]; // a leaf flipping to its pale side
    });
  }

  // --- The hill the tree stands on ---
  var hparts = [], hstatic = [], GB = 32, gbW = new Float32Array(GB), gx0 = 0, gspan = 1;
  function surf(x) { return 0.07 * (Math.exp(-(x / 1.15) * (x / 1.15)) - 1); }
  function buildGround() {
    var rnd = mulberry32(seed * 31 + 7), i, x;
    hparts = []; hstatic = [];
    gx0 = (0 - CX) / S - 0.05; gspan = (cw - CX) / S + 0.05 - gx0;
    var deep = (ch - GY) / S + 0.02;
    var nS = Math.round(cw / 3.2), nG = Math.round(cw / 2.2), nSoil = Math.round(cw * 1.1);
    for (i = 0; i < nS; i++) { x = gx0 + rnd() * gspan; hstatic.push({ x: x, y: surf(x) + (rnd() - 0.5) * 0.004, g: rnd() < 0.6 ? "_" : (rnd() < 0.5 ? "~" : "-") }); }
    for (i = 0; i < nSoil; i++) {
      x = gx0 + rnd() * gspan;
      var d = -Math.log(1 - rnd() * 0.98) * 0.03;
      if (d > deep) continue;
      hstatic.push({ x: x, y: surf(x) - 0.006 - d, g: d < 0.02 ? (rnd() < 0.5 ? ":" : ";") : "." });
    }
    for (i = 0; i < nG; i++) {
      x = gx0 + rnd() * gspan;
      var h = rnd() * rnd() * 0.03;
      hparts.push({ x: x, y: surf(x) + 0.004 + h, h: h, sh: rnd() * 6.2832, bi: Math.min(GB - 1, Math.floor((x - gx0) / gspan * GB)), g: GRASS[(rnd() * GRASS.length) | 0] });
    }
  }

  // --- Layout: tree beside your info on wide screens, below it on phones ---
  var cw, ch, S, CX, GY, sw, sh, fontPx, drawFrac = 1, R = null;
  function layout() {
    cw = window.innerWidth; ch = window.innerHeight;
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    var halfW = Math.max(-B.minX, B.maxX) * 1.05, wrap = document.querySelector(".wrap");
    if (cw >= 760) {
      // Center your info and the tree together as one group, a fixed gap apart.
      var cwid = 0;
      for (var k = 0; k < wrap.children.length; k++) cwid = Math.max(cwid, wrap.children[k].getBoundingClientRect().width);
      var gap = Math.max(56, cw * 0.06), edge = Math.max(24, cw * 0.05);
      GY = ch * 0.86;
      S = Math.min((GY - ch * 0.12) / B.maxY, cw * 0.25 / halfW, (cw - 2 * edge - cwid - gap) / (2 * halfW));
      var left = Math.max(edge, (cw - (cwid + gap + (B.maxX - B.minX) * S)) / 2);
      wrap.style.setProperty("--content-left", Math.round(left) + "px");
      CX = left + cwid + gap - B.minX * S;   // the tree's left edge starts one gap after your info
    } else {
      // Phones: the tree stands centered below your info, sized to the space that's left.
      wrap.style.removeProperty("--content-left");
      GY = ch * 0.93;
      var top = document.querySelector(".socials").getBoundingClientRect().bottom + 24;
      S = Math.max(60, Math.min((GY - top) / B.maxY, cw * 0.46 / halfW));
      CX = cw * 0.5;
    }
    fontPx = Math.max(6.5, Math.min(12, S * 0.016));
    sw = Math.ceil(fontPx * 0.9); sh = Math.ceil(fontPx * 1.3);
    drawFrac = Math.min(1, Math.pow(S / 340, 1.5)); // a smaller tree gets fewer glyphs, not darker ink
    buildGround();
    R.resize();
  }

  // --- GPU renderer (regl): every glyph's motion is worked out in the vertex shader,
  //     so each frame the CPU only hands over the time and the wind settings. ---
  var VERT = [
    "precision highp float;",
    "attribute vec2 aCorner;",
    "attribute vec4 a0, a1, a2, a3, a4, a5;",
    // a0: kind, glyph, pale glyph, thinning key
    // a1/a2: the limb's start and end (x, y, sway speed, sway phase); a3: their depths, position along the limb, has-parent
    // a4: per kind (limb offset | leaf offset, clump phase, clump speed | grass x, y, height, phase | soil x, y)
    // a5: shimmer phase
    "uniform float uT, uWind, uGust, uFlutter, uTreeH, uS, uCX, uGY, uDrawFrac;",
    "uniform vec2 uView, uCell, uGrid;",
    "varying vec2 vUv;",
    "float hash1(float n) { return fract(sin(n) * 43758.5453); }",
    "float noise1(float x) { float i = floor(x), f = fract(x); return mix(hash1(i), hash1(i + 1.0), f * f * (3.0 - 2.0 * f)); }",
    "float windAt(float t, float x, out float g) {",
    "  float base = 0.45 + 0.55 * noise1(t * 0.11 + 17.3);",
    "  float gg = clamp((noise1(t * 0.42 - x * 1.1 + 3.7) - 0.42) / 0.58, 0.0, 1.0);",
    "  g = gg * gg * (3.0 - 2.0 * gg);",
    "  return uWind * (0.45 * base + uGust * 1.1 * g);",
    "}",
    "vec2 bend(float t, vec4 e, float d, out float W, out float G) {",
    "  float h = e.y / uTreeH, flex = h * h * (1.0 + 0.12 * d);",
    "  W = windAt(t, e.x, G);",
    "  float amp = 0.25 + W;",
    "  float dx = W * flex * 0.10 + sin(t * e.z + e.w) * flex * 0.028 * amp;",
    "  return vec2(dx, -abs(dx) * 0.12 + cos(t * e.z * 1.27 + e.w) * flex * 0.028 * 0.3 * amp);",
    "}",
    "void main() {",
    "  float kind = a0.x, glyph = a0.y, t = uT;",
    "  vec2 pos;",
    "  if (kind < 0.5) {",
    "    pos = a4.xy;",
    "  } else if (kind < 1.5) {",
    "    float g; float W = windAt(t, a4.x, g);",
    "    pos = vec2(a4.x + W * 0.03 * (a4.z / 0.03 + 0.2) + 0.0016 * sin(t * 3.5 + a4.w) * uFlutter, a4.y);",
    "  } else if (kind < 3.5) {",
    "    if (a0.w > uDrawFrac) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); vUv = vec2(0.0); return; }",
    "    float W0 = 0.0, G0 = 0.0, W1, G1;",
    "    vec2 d0 = vec2(0.0);",
    "    if (a3.w > 0.5) d0 = bend(t, a1, a3.x, W0, G0);",
    "    vec2 d1 = bend(t, a2, a3.y, W1, G1);",
    "    vec2 base = mix(a1.xy, a2.xy, a3.z) + mix(d0, d1, a3.z);",
    "    if (kind < 2.5) {",
    "      pos = base + a4.xy;",
    "    } else {",
    "      float am = (0.3 + W1) * uFlutter;",
    "      float th = sin(t * a4.w + a4.z) * 0.08 * am * 1.4;",
    "      float cs = cos(th), sn = sin(th);",
    "      pos = base + vec2(a4.x * cs - a4.y * sn, a4.x * sn + a4.y * cs)",
    "          + vec2(0.0035 * am * sin(t * 3.8 + a5.x), 0.0025 * am * cos(t * 3.1 + a5.x * 1.3));",
    "      if (G1 > 0.45 && sin(t * 5.0 + a5.x * 3.0) > 0.985 - 0.03 * G1) glyph = a0.z;",
    "    }",
    "  } else {",
    "    pos = a4.xy;",
    "  }",
    "  vec2 px = vec2(uCX + pos.x * uS, uGY - pos.y * uS) + (aCorner - 0.5) * uCell;",
    "  gl_Position = vec4(px.x / uView.x * 2.0 - 1.0, 1.0 - px.y / uView.y * 2.0, 0.0, 1.0);",
    "  float gIdx = floor(glyph + 0.5);",
    "  vUv = (vec2(mod(gIdx, uGrid.x), floor(gIdx / uGrid.x)) + aCorner) / uGrid;",
    "}"
  ].join("\n");
  var FRAG = [
    "precision mediump float;",
    "uniform sampler2D uAtlas;",
    "uniform vec3 uInk;",
    "varying vec2 vUv;",
    "void main() { float a = texture2D(uAtlas, vUv).a; gl_FragColor = vec4(uInk * a, a); }"
  ].join("\n");

  function makeGPU() {
    if (typeof createREGL !== "function") return null;
    var regl;
    try {
      regl = createREGL({ canvas: cv, attributes: { alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false }, extensions: ["ANGLE_instanced_arrays"] });
    } catch (e) { return null; }
    if (!regl) return null;   // no WebGL here: regl reports that by returning null, not by throwing
    var COLS = 8, ROWS = Math.ceil(CHARS.length / COLS), STRIDE = 24, MAXFLY = 60;
    var atlas = document.createElement("canvas"), atlasTex = regl.texture();
    var inst = regl.buffer({ type: "float", usage: "static", length: 4 });
    var fly = regl.buffer({ type: "float", usage: "dynamic", length: MAXFLY * STRIDE * 4 });
    var flyData = new Float32Array(MAXFLY * STRIDE), N = 0, ink = [0, 0, 0];
    var t0 = performance.now(), leaves = [], last = 0;

    function attr(k) { return function (c, p) { return { buffer: p.buf, offset: k * 16, stride: STRIDE * 4, size: 4, divisor: 1 }; }; }
    var draw;
    try { draw = regl({
      vert: VERT, frag: FRAG,
      attributes: { aCorner: { buffer: regl.buffer([0, 0, 1, 0, 0, 1, 1, 1]), size: 2, divisor: 0 }, a0: attr(0), a1: attr(1), a2: attr(2), a3: attr(3), a4: attr(4), a5: attr(5) },
      uniforms: {
        uT: regl.prop("t"),
        uWind: function () { return P.wind; }, uGust: function () { return P.gust; }, uFlutter: function () { return P.flutter; },
        uTreeH: function () { return TREE_H; }, uS: function () { return S; }, uCX: function () { return CX; }, uGY: function () { return GY; },
        uDrawFrac: function () { return drawFrac; }, uView: function () { return [cw, ch]; }, uCell: function () { return [sw, sh]; },
        uGrid: [COLS, ROWS], uAtlas: atlasTex, uInk: function () { return ink; }
      },
      count: 4, primitive: "triangle strip", instances: regl.prop("n"),
      blend: { enable: true, func: { src: "one", dst: "one minus src alpha" } },
      depth: { enable: false }
    }); } catch (e) { regl.destroy(); freshCanvas(); return null; }

    // Every glyph drawn once, in white, into a small texture; the shader tints it with your ink color.
    function buildAtlas() {
      var cwp = Math.ceil(sw * dpr), chp = Math.ceil(sh * dpr), x = atlas.getContext("2d");
      atlas.width = COLS * cwp; atlas.height = ROWS * chp;
      x.fillStyle = "#fff";
      x.font = "500 " + (fontPx * dpr) + "px ui-monospace, SFMono-Regular, Menlo, monospace";
      x.textAlign = "center"; x.textBaseline = "middle";
      for (var i = 0; i < CHARS.length; i++) x.fillText(CHARS[i], (i % COLS + 0.5) * cwp, (Math.floor(i / COLS) + 0.5) * chp);
      atlasTex({ data: atlas, min: "linear", mag: "linear", premultiplyAlpha: true });
    }
    function inkRGB() { var m = /^#([0-9a-f]{6})$/i.exec(inkHex()), n = m ? parseInt(m[1], 16) : 0x22242a; return [(n >> 16) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }

    // Upload everything that doesn't change frame to frame: soil, grass, and every glyph of the tree.
    function buildInstances() {
      N = hstatic.length + hparts.length + tparts.length;
      var F = new Float32Array(N * STRIDE), o = 0, i, q;
      for (i = 0; i < hstatic.length; i++, o += STRIDE) { q = hstatic[i]; F[o + 1] = F[o + 2] = GI[q.g]; F[o + 16] = q.x; F[o + 17] = q.y; }
      for (i = 0; i < hparts.length; i++, o += STRIDE) { q = hparts[i]; F[o] = 1; F[o + 1] = F[o + 2] = GI[q.g]; F[o + 16] = q.x; F[o + 17] = q.y; F[o + 18] = q.h; F[o + 19] = q.sh; }
      for (i = 0; i < tparts.length; i++, o += STRIDE) {
        var p = tparts[i], c = p.k === 2 ? clumps[p.c] : null, s = segs[c ? c.seg : p.s], par = s.par >= 0 ? segs[s.par] : null;
        F[o] = p.k === 2 ? 3 : 2; F[o + 1] = GI[p.g]; F[o + 2] = GI[p.ga || p.g]; F[o + 3] = p.q;
        if (par) { F[o + 4] = par.x2; F[o + 5] = par.y2; F[o + 6] = par.om * 1000; F[o + 7] = par.ph; } else { F[o + 4] = s.x1; F[o + 5] = s.y1; }
        F[o + 8] = s.x2; F[o + 9] = s.y2; F[o + 10] = s.om * 1000; F[o + 11] = s.ph;
        F[o + 12] = par ? par.d : 0; F[o + 13] = s.d; F[o + 14] = c ? c.u : p.u; F[o + 15] = par ? 1 : 0;
        if (c) { F[o + 16] = p.lx; F[o + 17] = p.ly; F[o + 18] = c.rot; F[o + 19] = c.om * 1000; } else { F[o + 16] = p.ox; F[o + 17] = p.oy; }
        F[o + 20] = p.sh || p.q * 6.2832;
      }
      inst({ type: "float", usage: "static", data: F });
    }

    // Leaves torn loose in gusts: few enough to simulate on the CPU.
    function stepLeaves(now) {
      var dt = last ? Math.min(50, now - last) : 16, f = dt / 16, i;
      last = now;
      if (!reduce && leaves.length < MAXFLY) {
        var gmax = 0;
        for (i = 0; i < 3; i++) { windAt(now, B.minX + (B.maxX - B.minX) * i / 2); gmax = Math.max(gmax, WG); }
        if (Math.random() < (0.012 + 0.22 * gmax * P.wind) * f) {
          var src = tparts[leafIdx[(Math.random() * leafIdx.length) | 0]];
          if (src && src.q <= drawFrac) {
            var c = clumps[src.c], s = segs[c.seg], hh = s.y2 / TREE_H;
            leaves.push({ x: c.cx + src.lx + windAt(now, s.x2) * hh * hh * AMP, y: c.cy + src.ly, vx: 0.002, ph: Math.random() * 6.2832 });
          }
        }
      }
      for (i = leaves.length - 1; i >= 0; i--) {
        var L = leaves[i], Wl = windAt(now, L.x);
        L.vx += ((0.0015 + Wl * 0.008) - L.vx) * 0.03 * f;
        L.x += L.vx * f;
        L.y += (-0.0009 + Math.sin(now * 0.006 + L.ph) * 0.0008) * f;
        if (L.y < surf(L.x) || CX + L.x * S > cw + 20) leaves.splice(i, 1);
      }
      for (i = 0; i < leaves.length; i++) {
        var b = i * STRIDE, lf = leaves[i];
        flyData[b] = 4; flyData[b + 1] = flyData[b + 2] = GI[FLY[((now / 140 + lf.ph * 3) | 0) % FLY.length]];
        flyData[b + 16] = lf.x; flyData[b + 17] = lf.y;
      }
      return leaves.length;
    }

    return {
      gpu: true,
      resize: function () { ink = inkRGB(); buildAtlas(); buildInstances(); },
      retheme: function () { ink = inkRGB(); buildInstances(); },
      restart: function () { leaves = []; },
      frame: function (now) {
        var t = Math.max(0, (now - t0) / 1000) % 20000;
        regl.poll();
        regl.clear({ color: [0, 0, 0, 0] });
        if (N) draw({ buf: inst, n: N, t: t });
        var nf = stepLeaves(now);
        if (nf) { fly.subdata(flyData.subarray(0, nf * STRIDE)); draw({ buf: fly, n: nf, t: t }); }
      }
    };
  }

  // --- Fallback renderer (canvas 2D) for browsers without WebGL or if the library can't load ---
  function makeCanvas2D() {
    var ctx = cv.getContext("2d"), sprites = {}, groundLayer = null, leaves = [], last = 0;
    function buildSprites() {
      var ink = inkHex();
      sprites = {};
      for (var i = 0; i < CHARS.length; i++) {
        var c = document.createElement("canvas");
        c.width = Math.ceil(sw * dpr); c.height = Math.ceil(sh * dpr);
        var x = c.getContext("2d");
        x.scale(dpr, dpr); x.fillStyle = ink;
        x.font = "500 " + fontPx + "px ui-monospace, SFMono-Regular, Menlo, monospace";
        x.textAlign = "center"; x.textBaseline = "middle";
        x.fillText(CHARS[i], sw / 2, sh / 2);
        sprites[CHARS[i]] = c;
      }
    }
    function resize() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildSprites();
      // The soil and ground line never move: draw them once into a cached layer.
      groundLayer = document.createElement("canvas");
      groundLayer.width = cv.width; groundLayer.height = cv.height;
      var gx = groundLayer.getContext("2d");
      gx.setTransform(dpr, 0, 0, dpr, 0, 0);
      for (var i = 0; i < hstatic.length; i++) { var q = hstatic[i]; gx.drawImage(sprites[q.g], CX + q.x * S - sw / 2, GY - q.y * S - sh / 2, sw, sh); }
    }
    function frame(t) {
      var dt = last ? Math.min(50, t - last) : 16, f = dt / 16, i, maxG = 0;
      last = t;
      for (i = 0; i < segs.length; i++) {
        var s = segs[i];
        if (s.par < 0) { s.dx0 = 0; s.dy0 = 0; } else { s.dx0 = segs[s.par].dx1; s.dy0 = segs[s.par].dy1; }
        var h = s.y2 / TREE_H, flex = h * h * (1 + 0.12 * s.d);
        var W = windAt(t, s.x2), amp = 0.25 + W;
        if (WG > maxG) maxG = WG;
        s.G = WG; s.W = W;
        s.dx1 = W * flex * AMP + Math.sin(t * s.om + s.ph) * flex * AMP2 * amp;
        s.dy1 = -Math.abs(s.dx1) * 0.12 + Math.cos(t * s.om * 1.27 + s.ph) * flex * AMP2 * 0.3 * amp;
      }
      for (i = 0; i < clumps.length; i++) {
        var c = clumps[i], cs = segs[c.seg];
        c.X = c.cx + cs.dx0 + (cs.dx1 - cs.dx0) * c.u;
        c.Y = c.cy + cs.dy0 + (cs.dy1 - cs.dy0) * c.u;
        var th = Math.sin(t * c.om + c.rot) * ROT * (0.3 + cs.W) * P.flutter * 1.4;
        c.cs = Math.cos(th); c.sn = Math.sin(th); c.W = cs.W; c.G = cs.G;
      }
      for (i = 0; i < GB; i++) gbW[i] = windAt(t, gx0 + (i + 0.5) * gspan / GB);

      ctx.clearRect(0, 0, cw, ch);
      ctx.drawImage(groundLayer, 0, 0, cw, ch);
      var hw = sw / 2, hh = sh / 2, X, Y, g;
      for (i = 0; i < hparts.length; i++) {
        var q = hparts[i];
        X = q.x + gbW[q.bi] * 0.03 * (q.h / 0.03 + 0.2) + 0.0016 * Math.sin(t * 0.0035 + q.sh) * P.flutter;
        ctx.drawImage(sprites[q.g], CX + X * S - hw, GY - q.y * S - hh, sw, sh);
      }
      for (i = 0; i < tparts.length; i++) {
        var p = tparts[i];
        if (p.q > drawFrac) continue;
        g = p.g;
        if (p.k === 1) {
          var ps = segs[p.s];
          X = ps.x1 + (ps.x2 - ps.x1) * p.u + p.ox + ps.dx0 + (ps.dx1 - ps.dx0) * p.u;
          Y = ps.y1 + (ps.y2 - ps.y1) * p.u + p.oy + ps.dy0 + (ps.dy1 - ps.dy0) * p.u;
        } else {
          var pc = clumps[p.c], a = (0.3 + pc.W) * P.flutter;
          X = pc.X + p.lx * pc.cs - p.ly * pc.sn + 0.0035 * a * Math.sin(t * 0.0038 + p.sh);
          Y = pc.Y + p.lx * pc.sn + p.ly * pc.cs + 0.0025 * a * Math.cos(t * 0.0031 + p.sh * 1.3);
          if (pc.G > 0.45 && Math.sin(t * 0.005 + p.sh * 3) > 0.985 - 0.03 * pc.G) g = p.ga;
          p.X = X; p.Y = Y;
        }
        ctx.drawImage(sprites[g], CX + X * S - hw, GY - Y * S - hh, sw, sh);
      }
      if (!reduce && leaves.length < 50 && Math.random() < (0.012 + 0.22 * maxG * P.wind) * f) {
        var src = tparts[leafIdx[(Math.random() * leafIdx.length) | 0]];
        if (src && src.X !== undefined) leaves.push({ x: src.X, y: src.Y, vx: 0.002, ph: Math.random() * 6.2832 });
      }
      for (i = leaves.length - 1; i >= 0; i--) {
        var L = leaves[i], Wl = windAt(t, L.x);
        L.vx += ((0.0015 + Wl * 0.008) - L.vx) * 0.03 * f;
        L.x += L.vx * f;
        L.y += (-0.0009 + Math.sin(t * 0.006 + L.ph) * 0.0008) * f;
        ctx.drawImage(sprites[FLY[((t / 140 + L.ph * 3) | 0) % FLY.length]], CX + L.x * S - hw, GY - L.y * S - hh, sw, sh);
        if (L.y < surf(L.x) || CX + L.x * S > cw + 20) leaves.splice(i, 1);
      }
    }
    return { gpu: false, resize: resize, retheme: resize, restart: function () { leaves = []; }, frame: frame };
  }

  // A canvas tied to WebGL can't switch to 2D, so a fallback gets a fresh canvas.
  function freshCanvas() {
    var fresh = cv.cloneNode(false);
    cv.parentNode.replaceChild(fresh, cv);
    cv = fresh;
  }
  // If the GPU path fails mid-flight, fall back to 2D.
  function fallBack() { freshCanvas(); R = makeCanvas2D(); layout(); }
  function render(now) {
    try { R.frame(now); }
    catch (e) { if (R.gpu) { fallBack(); R.frame(now); } else throw e; }
  }
  var running = false, booted = false;
  function loop(now) { render(now); requestAnimationFrame(loop); }
  function run() {
    if (reduce) { render(performance.now()); return; }
    if (!running) { running = true; requestAnimationFrame(loop); }
  }

  function init() { buildTree(seed); detectDark(); assign(); layout(); }
  function start() {
    try { R = makeGPU(); } catch (e) { R = null; freshCanvas(); }
    if (!R) R = makeCanvas2D();
    init();
    run();
    // Your name's width changes once the web font arrives; re-center then.
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { layout(); if (reduce) render(performance.now()); });
  }
  // Fetch the WebGL library after first paint; if it fails, start() falls back to 2D.
  function boot() {
    if (booted) return;
    booted = true;
    if (typeof createREGL === "function") { start(); return; }
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/regl/2.1.0/regl.min.js";
    s.onload = s.onerror = start;
    document.head.appendChild(s);
  }
  // Let your photo and name paint first; the tree builds right after.
  requestAnimationFrame(function () { setTimeout(boot, 0); });

  var rt;
  addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      if (!R) return;
      layout(); if (reduce) render(performance.now());
    }, 120);
  });
  function retheme() { if (!R) return; detectDark(); assign(); R.retheme(); if (reduce) render(performance.now()); }
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retheme);
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  // --- Tuning panel (visit #tune or press "t") ---
  var tune = document.getElementById("tune");
  function showTune(v) { tune.hidden = !v; }
  showTune(location.hash === "#tune");
  addEventListener("hashchange", function () { showTune(location.hash === "#tune"); });
  addEventListener("keydown", function (e) {
    if (e.key === "t" && !e.metaKey && !e.ctrlKey && !e.altKey && !/input|textarea|select/i.test(e.target.tagName)) showTune(tune.hidden);
  });
  ["wind", "gust", "flutter"].forEach(function (k) {
    var el = document.getElementById("t-" + k), out = document.getElementById("t-" + k + "-v");
    el.value = P[k]; out.textContent = P[k].toFixed(2);
    el.addEventListener("input", function () { P[k] = parseFloat(el.value); out.textContent = P[k].toFixed(2); });
  });
  var seedOut = document.getElementById("t-seed");
  seedOut.textContent = seed;
  document.getElementById("t-new").addEventListener("click", function () {
    if (!R) return;
    seed++; seedOut.textContent = seed; init(); R.restart(); if (reduce) render(performance.now());
  });
})();
</script>

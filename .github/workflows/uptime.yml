name: Uptime check

# Once a day, confirm the site loads and shows the page. A failed run emails you.
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Site loads and shows the page
        run: |
          curl -fsSL --retry 3 --retry-delay 20 https://ndrewchen.com/ -o page.html
          grep -q "Andrew Chen" page.html
          curl -fsSIL https://ndrewchen.com/pfp.webp > /dev/null
